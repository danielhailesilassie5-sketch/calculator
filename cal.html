<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini calculator</title>
    <link rel="stylesheet" href="cal.css">
</head>
<body>
    <section>
        <div>
            <h2 class="text"> <b>ios Calculator</b></h2>
        </div>
        <div>
            <button class="display">0</button> 
        </div>
        <div class="but">
            <button class="ac">AC</button>
            <button>00</button>
            <button>%</button>
            <button class="opr">÷</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="opr">×</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="opr">-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="opr">+</button>
            <button class="zero">0</button>
            <button>.</button>
            <button class="opr">=</button>
        </div>
    </section>
    <script src="cal.js"></script>
    
</body>
</html>
